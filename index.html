<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#0b0e14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fantasy App">
  <meta name="application-name" content="Fantasy App">
  <title>JP is a virgin - 2026 ESPN Fantasy Football Command Center</title>
  <meta name="description"
    content="Dedicated 2026 ESPN Fantasy Football Command Center for JP is a virgin. Live trades, waivers, draft intelligence, and matchups.">

  <!-- Web App Manifest for PWA Installation -->
  <link rel="manifest" href="/manifest.webmanifest">

  <!-- Apple Touch Icons for iPhone Home Screen -->
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png">

  <!-- Browser Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">

  <!-- Google Fonts: Outfit, Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet">

  <!-- Font Awesome 6 Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Chart.js 4.4 CDN (Deferred so parsing is non-blocking) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>

  <!-- Application Stylesheets -->
  <link rel="stylesheet" href="./src/css/main.css">
  <link rel="stylesheet" href="./src/css/components.css">
  <link rel="stylesheet" href="./src/css/pages.css">
</head>

<body>
  <div id="app-root">
    <!-- Navigation Header Mount -->
    <div id="header-mount"></div>

    <!-- Live Announcement Ticker Mount -->
    <div id="ticker-mount"></div>

    <!-- Dynamic View Page Container -->
    <main id="main-view-container" class="main-content">
      <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:60vh; text-align:center; color:#f8fafc; padding:1.5rem;">
        <i class="fa-solid fa-football" style="font-size:3.5rem; color:#00e676; margin-bottom:1.25rem; animation: pulseGlow 1.5s infinite alternate;"></i>
        <h2 style="font-size:1.6rem; font-weight:800; letter-spacing:0.02em;">Loading Fantasy League Command Center...</h2>
        <p style="color:#cbd5e1; font-size:0.95rem; margin-top:0.5rem; max-width:480px;">
          Initializing live matchups, roster intelligence, verified trades, and draft analytics for JP is a virgin...
        </p>
      </div>
    </main>

    <!-- Global Search Modal Mount -->
    <div id="search-modal-mount"></div>
  </div>

  <!-- Frontend JavaScript Architecture -->
  <script src="./src/js/data/mockData.js"></script>
  <script src="./src/js/analyticsEngine.js"></script>
  <script src="./src/js/store.js"></script>
  <script src="./src/js/components/ChartManager.js"></script>
  <script src="./src/js/components/Header.js"></script>
  <script src="./src/js/components/Ticker.js"></script>
  <script src="./src/js/components/SearchModal.js"></script>
  <script src="./src/js/views/HomeView.js"></script>
  <script src="./src/js/views/LeagueView.js"></script>
  <script src="./src/js/views/TeamView.js"></script>
  <script src="./src/js/views/PlayerView.js"></script>
  <script src="./src/js/views/AnalyticsView.js"></script>
  <script src="./src/js/views/H2HView.js"></script>
  <script src="./src/js/views/RecordsView.js"></script>
  <script src="./src/js/views/TradeView.js"></script>
  <script src="./src/js/views/FreeAgencyView.js"></script>
  <script src="./src/js/views/DraftView.js"></script>
  <script src="./src/js/views/MatchupView.js"></script>
  <script src="./src/js/views/EfficiencyView.js"></script>
  <script src="./src/js/pwa.js"></script>
  <script src="./src/js/app.js"></script>
</body>

</html>
