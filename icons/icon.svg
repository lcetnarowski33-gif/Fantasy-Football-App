<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#141a24" />
        <stop offset="50%" stop-color="#0b0e14" />
        <stop offset="100%" stop-color="#05070a" />
      </linearGradient>

      <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00e676" />
        <stop offset="50%" stop-color="#00b0ff" />
        <stop offset="100%" stop-color="#f59e0b" />
      </linearGradient>

      <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fbbf24" />
        <stop offset="100%" stop-color="#d97706" />
      </linearGradient>

      <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00e676" />
        <stop offset="100%" stop-color="#00a854" />
      </linearGradient>

      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="10" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
      </filter>
    </defs>

    <!-- Background (Full 512x512) -->
    <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />

    <!-- Outer Tech Glow Ring -->
    <circle cx="256" cy="256" r="230" fill="none" stroke="url(#glowGrad)" stroke-width="3" stroke-dasharray="8 8" opacity="0.4" />

    <!-- Scaled Content for Safe Zone -->
    <g transform="translate(30.72, 30.72) scale(0.88)">
      <!-- Shield / Badge Frame -->
      <path d="M 256,40 L 410,105 C 410,260 350,380 256,440 C 162,380 102,260 102,105 Z"
            fill="#101722" stroke="url(#glowGrad)" stroke-width="6" filter="url(#subtleShadow)" />

      <!-- Analytics Graph Bars (Behind Football) -->
      <rect x="175" y="270" width="22" height="60" rx="4" fill="#00e676" opacity="0.35" />
      <rect x="210" y="235" width="22" height="95" rx="4" fill="#00b0ff" opacity="0.4" />
      <rect x="245" y="210" width="22" height="120" rx="4" fill="#fbbf24" opacity="0.45" />
      <rect x="280" y="250" width="22" height="80" rx="4" fill="#00e676" opacity="0.4" />
      <rect x="315" y="220" width="22" height="110" rx="4" fill="#00b0ff" opacity="0.35" />

      <!-- Stylized American Football Shape (Tilted 35 deg) -->
      <g transform="translate(256, 210) rotate(-32) scale(0.95)">
        <!-- Football Base Body -->
        <path d="M -95,0 C -95,-68 95,-68 95,0 C 95,68 -95,68 -95,0 Z" 
              fill="url(#goldGrad)" stroke="#ffffff" stroke-width="4" filter="url(#glow)" />

        <!-- Football End White Stripes -->
        <path d="M -65,-36 C -50,-10 -50,10 -65,36" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
        <path d="M 65,-36 C 50,-10 50,10 65,36" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

        <!-- Football Laces -->
        <!-- Center Seam -->
        <line x1="-38" y1="0" x2="38" y2="0" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
        <!-- Cross Laces -->
        <line x1="-24" y1="-14" x2="-24" y2="14" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
        <line x1="-8" y1="-14" x2="-8" y2="14" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
        <line x1="8" y1="-14" x2="8" y2="14" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
        <line x1="24" y1="-14" x2="24" y2="14" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
      </g>

      <!-- Analytics Spark Line -->
      <path d="M 140,320 Q 200,280 256,220 T 370,180" fill="none" stroke="#00e676" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />
      <circle cx="370" cy="180" r="7" fill="#00e676" filter="url(#glow)" />

      <!-- App Title Text -->
      <text x="256" y="385" text-anchor="middle" font-family="'Outfit', -apple-system, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="2">
        FANTASY
      </text>
      <text x="256" y="415" text-anchor="middle" font-family="'Outfit', -apple-system, sans-serif" font-weight="800" font-size="20" fill="#00e676" letter-spacing="4">
        ANALYTICS
      </text>
    </g>
  </svg>